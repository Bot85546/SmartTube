name: PiTube test APKs

on:
  push:
    branches:
      - pitube-v10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitube-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PiTube and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure pinned Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
          # The upstream source includes historical, unrecognized wrapper jars.
          # Use the action's downloaded Gradle distribution, never those jars.
          validate-wrappers: false

      - name: Require permanent PiTube signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.PITUBE_SIGNING_BUNDLE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo '::error::Permanent signing is not configured. Add the PITUBE_SIGNING_BUNDLE_B64 repository secret before building; disposable debug keys cannot update installed apps.'
            exit 1
          fi
          signing_dir="$RUNNER_TEMP/pitube-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$SIGNING_BUNDLE" | base64 --decode | tar -xz -C "$signing_dir"
          test -s "$signing_dir/pitube.jks"
          test -s "$signing_dir/keystore.properties"
          cp "$signing_dir/keystore.properties" keystore.properties
          printf '\nstoreFile=%s/pitube.jks\n' "$signing_dir" >> keystore.properties
          chmod 600 keystore.properties "$signing_dir/pitube.jks"

      - name: Confirm signing identity
        shell: bash
        run: |
          set -euo pipefail
          # The APK certificate must match the previous installed build for updates.
          echo 'Permanent signing material loaded for both PiTube variants.'

      - name: Build PiTube TV and tablet preview
        run: |
          gradle --no-daemon --stacktrace :smarttubetv:assembleStpitubeDebug :smarttubetv:assembleStpitubetabletDebug

      - name: Check APKs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          test -s "${tv[0]}"
          test -s "${tablet[0]}"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          tv_cert="$($apksigner_path verify --print-certs "${tv[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          tablet_cert="$($apksigner_path verify --print-certs "${tablet[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$tv_cert"
          if [[ "$tv_cert" != "$tablet_cert" ]]; then
            echo '::error::TV and tablet APKs have different signing certificates.'
            exit 1
          fi
          echo "Both APKs use signing certificate SHA-256: $tv_cert"
          sha256sum "${tv[0]}" "${tablet[0]}" > PiTube-SHA256SUMS.txt
          cat PiTube-SHA256SUMS.txt

      - name: Attach APKs to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: PiTube-test-apks-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk
            smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk
            PiTube-SHA256SUMS.txt

      - name: Publish test release with direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          gh release create "pitube-test-${GITHUB_RUN_NUMBER}" \
            "${tv[0]}" "${tablet[0]}" PiTube-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PiTube v13 test build ${GITHUB_RUN_NUMBER}" \
            --notes 'Permanently signed PiTube TV and Galaxy Tab S11 Ultra test APKs. Once an installation uses this signing certificate, all subsequent PiTube builds can update it in place. Older preview APKs may use incompatible disposable debug certificates and require a one-time migration. Keep a private backup of the signing bundle.' \
            --prerelease
