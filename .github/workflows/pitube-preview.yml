name: PiTube APKs (stable updates or isolated tests)

on:
  push:
    branches:
      - pitube-v10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitube-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PiTube and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure pinned Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
          # The upstream source includes historical, unrecognized wrapper jars.
          # Use the action's downloaded Gradle distribution, never those jars.
          validate-wrappers: false

      - name: Configure persistent signing if available
        shell: bash
        env:
          PITUBE_SIGNING_BUNDLE_B64: ${{ secrets.PITUBE_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$PITUBE_SIGNING_BUNDLE_B64" ]]; then
            echo "PITUBE_TEST_BUILD_SUFFIX=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "PITUBE_UPDATABLE=false" >> "$GITHUB_ENV"
            echo "Permanent signing secret not configured; building isolated test apps."
            exit 0
          fi

          signing_dir="$(mktemp -d)"
          chmod 700 "$signing_dir"
          printf '%s' "$PITUBE_SIGNING_BUNDLE_B64" |
            base64 --decode | tar -xz -C "$signing_dir"
          key_file="$(find "$signing_dir" -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' \) -print -quit)"
          props_file="$(find "$signing_dir" -type f -name 'keystore.properties' -print -quit)"
          if [[ -z "$key_file" || -z "$props_file" ]]; then
            echo "::error::Signing bundle needs a keystore and keystore.properties."
            exit 1
          fi
          cp "$key_file" "$GITHUB_WORKSPACE/pitube-private.jks"
          awk '
            /^storeFile=/ { print "storeFile=../pitube-private.jks"; found=1; next }
            { print }
            END { if (!found) print "storeFile=../pitube-private.jks" }
          ' "$props_file" > "$GITHUB_WORKSPACE/keystore.properties"
          for key in storePassword keyAlias keyPassword; do
            if ! grep -q "^$key=." "$GITHUB_WORKSPACE/keystore.properties"; then
              echo "::error::Signing bundle is missing $key."
              exit 1
            fi
          done
          echo "PITUBE_TEST_BUILD_SUFFIX=" >> "$GITHUB_ENV"
          echo "PITUBE_UPDATABLE=true" >> "$GITHUB_ENV"
          echo "Signing configured for the permanent PiTube app IDs."

      - name: Confirm app identity
        run: |
          if [[ "$PITUBE_UPDATABLE" == "true" ]]; then
            echo "Updateable TV ID: dev.pradi.pitube"
            echo "Updateable tablet ID: dev.pradi.pitube.preview"
          else
            echo "Isolated TV ID: dev.pradi.pitube.test${PITUBE_TEST_BUILD_SUFFIX}"
            echo "Isolated tablet ID: dev.pradi.pitube.preview.test${PITUBE_TEST_BUILD_SUFFIX}"
          fi

      - name: Build PiTube TV and tablet preview
        run: |
          gradle --no-daemon --stacktrace :smarttubetv:assembleStpitubeDebug :smarttubetv:assembleStpitubetabletDebug

      - name: Check APKs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          test -s "${tv[0]}"
          test -s "${tablet[0]}"
          sha256sum "${tv[0]}" "${tablet[0]}" > PiTube-SHA256SUMS.txt
          cat PiTube-SHA256SUMS.txt

      - name: Attach APKs to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: PiTube-test-apks-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk
            smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk
            PiTube-SHA256SUMS.txt

      - name: Publish test release with direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          if [[ "$PITUBE_UPDATABLE" == "true" ]]; then
            tag="pitube-update-${GITHUB_RUN_NUMBER}"
            title="PiTube v18 updateable build ${GITHUB_RUN_NUMBER}"
            notes="Permanently signed TV package: dev.pradi.pitube; tablet package: dev.pradi.pitube.preview. Newer PiTube releases signed with the same key and using the same package IDs install as updates without uninstalling this app. The first permanent build must be installed once; numbered test builds are independent apps."
          else
            tag="pitube-test-${GITHUB_RUN_NUMBER}"
            title="PiTube v18 isolated test build ${GITHUB_RUN_NUMBER}"
            notes="Permanent signing is not configured. TV package: dev.pradi.pitube.test${GITHUB_RUN_NUMBER}; tablet package: dev.pradi.pitube.preview.test${GITHUB_RUN_NUMBER}. These are isolated test apps and will NOT update one another. Add the PITUBE_SIGNING_BUNDLE_B64 Actions secret to switch this workflow to permanent app IDs and updateable signing."
          fi
          gh release create "$tag" \
            "${tv[0]}" "${tablet[0]}" PiTube-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            --prerelease
