name: PiTube test APKs

on:
  push:
    branches:
      - pitube-v10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitube-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PiTube and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure pinned Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
          # The upstream source includes historical, unrecognized wrapper jars.
          # Use the action's downloaded Gradle distribution, never those jars.
          validate-wrappers: false

      - name: Use repository test signing key when configured
        env:
          KEYSTORE_B64: ${{ secrets.PITUBE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PITUBE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PITUBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PITUBE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > pitube-test-key.jks
            {
              printf 'storeFile=%s/pitube-test-key.jks\n' "$GITHUB_WORKSPACE"
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > keystore.properties
          fi

      - name: Build PiTube TV and tablet preview
        run: |
          gradle --no-daemon --stacktrace :smarttubetv:assembleStpitubeDebug :smarttubetv:assembleStpitubetabletDebug

      - name: Check APKs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          test -s "${tv[0]}"
          test -s "${tablet[0]}"
          sha256sum "${tv[0]}" "${tablet[0]}" > PiTube-SHA256SUMS.txt
          cat PiTube-SHA256SUMS.txt

      - name: Attach APKs to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: PiTube-test-apks-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk
            smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk
            PiTube-SHA256SUMS.txt

      - name: Publish test release with direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          gh release create "pitube-test-${GITHUB_RUN_NUMBER}" \
            "${tv[0]}" "${tablet[0]}" PiTube-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PiTube v11 test build ${GITHUB_RUN_NUMBER}" \
            --notes 'Experimental Android TV and Galaxy Tab S11 Ultra APKs. If this CI build uses a different test signing key from your installed PiTube, Android will require uninstalling the old test build first (which clears app data). Use the tablet flavor for the S11 Ultra and the TV flavor for BRAVIA.' \
            --prerelease
