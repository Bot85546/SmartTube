name: PiTube test APKs

on:
  push:
    branches:
      - pitube-v10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitube-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A distinct install identity for every test build avoids Android's
      # signature-mismatch error without deleting the previously installed app.
      PITUBE_TEST_BUILD_SUFFIX: ${{ github.run_number }}
    steps:
      - name: Checkout PiTube and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure pinned Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
          # The upstream source includes historical, unrecognized wrapper jars.
          # Use the action's downloaded Gradle distribution, never those jars.
          validate-wrappers: false

      - name: Confirm isolated test app identity
        run: |
          echo "New PiTube TV ID: dev.pradi.pitube.test${PITUBE_TEST_BUILD_SUFFIX}"
          echo "New PiTube tablet ID: dev.pradi.pitube.preview.test${PITUBE_TEST_BUILD_SUFFIX}"

      - name: Build PiTube TV and tablet preview
        run: |
          gradle --no-daemon --stacktrace :smarttubetv:assembleStpitubeDebug :smarttubetv:assembleStpitubetabletDebug

      - name: Check APKs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          test -s "${tv[0]}"
          test -s "${tablet[0]}"
          sha256sum "${tv[0]}" "${tablet[0]}" > PiTube-SHA256SUMS.txt
          cat PiTube-SHA256SUMS.txt

      - name: Attach APKs to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: PiTube-test-apks-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk
            smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk
            PiTube-SHA256SUMS.txt

      - name: Publish test release with direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tv=(smarttubetv/build/outputs/apk/stpitube/debug/*_universal.apk)
          tablet=(smarttubetv/build/outputs/apk/stpitubetablet/debug/*_universal.apk)
          gh release create "pitube-test-${GITHUB_RUN_NUMBER}" \
            "${tv[0]}" "${tablet[0]}" PiTube-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PiTube v17 isolated test build ${GITHUB_RUN_NUMBER}" \
            --notes "TV package: dev.pradi.pitube.test${GITHUB_RUN_NUMBER}; tablet package: dev.pradi.pitube.preview.test${GITHUB_RUN_NUMBER}. Both install separately from all earlier PiTube builds, so you do not need to uninstall or clear the existing app. Each future test release uses another unique ID and is installed side-by-side, rather than updating previous test builds. Delete old versions only when you no longer need them." \
            --prerelease
